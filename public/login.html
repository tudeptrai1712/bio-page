<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Bio Page</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 6 Free Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Material 3 Expressive Styles & External Login Stylesheet -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="/api/theme.css">
</head>
<body data-theme="classic-gray">
  <!-- Expressive Ambient Background Blobs -->
  <div class="bg-blob-1"></div>

  <div class="login-bento-card">
    <div class="login-header">
      <div class="login-badge-icon">
        <i class="fas fa-fingerprint"></i>
      </div>
      <h1 class="login-title">Admin Console</h1>
      <p class="login-subtitle" id="login-subtitle">Sign in with Passkey or Password</p>
    </div>

    <div class="error-box" id="error-box">
      <i class="fas fa-circle-exclamation"></i>
      <span id="error-text">Invalid credentials</span>
    </div>

    <!-- WebAuthn Passkey Button -->
    <button type="button" class="btn-passkey m3-ripple-surface" id="btn-passkey-login">
      <i class="fas fa-key"></i>
      <span>Sign in with Passkey / Biometrics</span>
    </button>

    <div class="divider" id="login-divider">or enter password</div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-wrapper">
          <i class="fas fa-user input-icon"></i>
          <input type="text" id="username" class="form-input" placeholder="admin" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn-submit m3-ripple-surface" id="btn-submit">
        <span>Sign In</span>
        <i class="fas fa-arrow-right"></i>
      </button>
    </form>

    <!-- Fallback / Recovery TOTP Form -->
    <form id="totp-form" class="totp-form">
      <div class="form-group">
        <label class="form-label" for="totp-username">Username</label>
        <div class="input-wrapper">
          <i class="fas fa-user input-icon"></i>
          <input type="text" id="totp-username" class="form-input" placeholder="admin" autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="totp-code">6-Digit Authenticator Code</label>
        <div class="input-wrapper">
          <i class="fas fa-shield-halved input-icon"></i>
          <input type="text" id="totp-code" class="form-input totp-input-code" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
        </div>
      </div>

      <button type="submit" class="btn-submit btn-totp-submit m3-ripple-surface" id="btn-totp-submit">
        <span>Verify Code & Sign In</span>
        <i class="fas fa-arrow-right"></i>
      </button>
    </form>

    <!-- Recovery / Fallback Links -->
    <div class="login-toggle-area">
      <button type="button" id="btn-toggle-totp" class="btn-toggle-totp">
        <i class="fas fa-shield-halved"></i> <span id="toggle-totp-text">Sign in with Authenticator App (TOTP)</span>
      </button>
    </div>

    <div class="login-footer-nav">
      <a href="/" class="back-home">
        <i class="fas fa-arrow-left"></i> Back to Bio Page
      </a>
    </div>
  </div>

  <script src="https://unpkg.com/@simplewebauthn/browser@13.1.0/dist/bundle/index.umd.min.js"></script>
  <script src="/js/m3-theme.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
