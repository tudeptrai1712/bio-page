services:
  bio-page:
    build: .
    container_name: bio-page
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - JWT_SECRET=super-secret-bio-jwt-key-please-change-in-production
      - REDIS_URL=redis://redis:6379
      - RP_NAME=Bio Page Passkey
      - RP_ID=localhost
      - ORIGIN=http://localhost:3000
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - bio-network

  redis:
    image: redis:7-alpine
    container_name: bio-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - bio-network

networks:
  bio-network:
    name: bio-network
    driver: bridge
